<!-- Ctrl+Z(팀) · Ctrl+Center(프로젝트) 키캡 듀오 로고의 파비콘 판.
     components/Logo.tsx 와 같은 형태이고, 32px 에서 글자가 뭉개지지 않도록
     겹침을 줄이고 자간 대신 키캡을 키웠습니다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="0" y="6" width="20" height="20" rx="5" fill="#14172B"/>
  <text x="10" y="16.8" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif" font-size="13"
        font-weight="800" fill="#FFFFFF">Z</text>

  <rect x="12" y="6" width="20" height="20" rx="5" fill="#3366FF"
        stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="22" y="16.8" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif" font-size="13"
        font-weight="800" fill="#FFFFFF">C</text>
</svg>
